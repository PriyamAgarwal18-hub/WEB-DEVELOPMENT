<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Online Book Store</title>
    <style>
        * {
            margin: 0px;
            padding: 0px;
            box-sizing: border-box;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-family: Arial, sans-serif;
        }

        table, th, td {
            border: 1px solid black;
        }

        .header-row {
            background: rgb(176, 88, 21);
            height: 80px;
        }

        .logo-cell {
            width: 200px;
            text-align: center;
            vertical-align: middle;
        }

        .logo-cell img {
            max-width: 70px;
            max-height: 70px;
            object-fit: contain;
        }

        .title-cell {
            color: rgb(43, 21, 21);
            font-size: 30px;
            font-weight: bold;
            text-align: center;
            vertical-align: middle;
        }

        .menu-row {
            background: rgb(172, 118, 76);
            height: 50px;
            text-align: center;
        }

        .menu-row td {
            width: 20%;
        }

        .menu-row a {
            text-decoration: none;
            color: rgb(66, 16, 16);
            font-weight: bold;
            display: block;
            width: 100%;
            line-height: 50px;
        }

        .left-menu {
            width: 200px;
            vertical-align: top;
            text-align: center;
            padding-top: 20px;
        }

        .left-menu a {
            display: block;
            text-decoration: none;
            color: rgb(66, 16, 16);
            font-weight: bold;
            margin-block: 2.5rem;
        }

        .right-content {
            height: 500px;
            vertical-align: top;
        }

        .right-content iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>

    <table>
        <tr class="header-row">
            <td class="logo-cell">
                <img src="logo.jpg" alt="GL Bajaj Logo">
            </td>
            <td colspan="4" class="title-cell">Online Book Store</td>
        </tr>

        <tr class="menu-row">
            <td><a href="home.html" target="content">Home</a></td>
            <td><a href="login.html">Login</a></td>
            <td><a href="registration.html">Registration</a></td>
            <td><a href="catalogue.html">Catalogue</a></td>
            <td><a href="cart.html">Cart</a></td>
        </tr>

        <tr>
            <td class="left-menu">
                <a href="CSE.html" target="content">CSE</a>
                <a href="ECE.html" target="content">ECE</a>
                <a href="EEE.html" target="content">EEE</a>
                <a href="CIVIL.html" target="content">CIVIL</a>
            </td>
            <td colspan="4" class="right-content">
                <iframe src="home.html" name="content"></iframe>
            </td>
        </tr>
    </table>

</body>
</html>
